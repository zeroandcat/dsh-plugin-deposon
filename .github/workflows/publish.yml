name: publish-image
on:
  push:
    branches: ['b/organ-v311-preview11']
    paths: ['docker/**', '.github/workflows/publish.yml']
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Semantic image tag; if omitted, a commit-message marker [image:<tag>] is used instead'
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tags
        id: tags
        run: |
          # workflow_dispatch API requires the workflow file on the default branch;
          # until main carries it, semantic tags ride on the [image:<tag>] commit marker.
          SEMANTIC="${{ inputs.image_tag }}"
          if [ -z "$SEMANTIC" ]; then
            SEMANTIC="$(git log -1 --pretty=%s | grep -oE '\[image:[^]]+\]' | head -1 | tr -d '[]' | sed 's/^image://')"
          fi
          {
            echo "sha=ghcr.io/${GITHUB_REPOSITORY}:sha-${GITHUB_SHA::7}"
            if [ -n "$SEMANTIC" ]; then
              echo "semantic=ghcr.io/${GITHUB_REPOSITORY}:${SEMANTIC}"
            fi
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.runtime
          push: true
          tags: |
            ${{ steps.tags.outputs.sha }}
            ${{ steps.tags.outputs.semantic }}
          labels: |
            org.opencontainers.image.title=dsh-plugin-deposon runtime
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

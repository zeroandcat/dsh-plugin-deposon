name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gates-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # thermo_demo --check runs the preview.9 memory face from git history (4ee12b6)
          # as the before-reading; shallow clones would silently fall back to the simulator.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install cryptography (executor face runtime dependency, preview.11)
        run: pip install --quiet cryptography
      - name: Compile all Python sources
        run: python -m compileall -q harness gates mocks scripts tests
      - name: Gate arithmetic self-test (pure math, no external data)
        run: python tests/test_gates.py
      - name: Judgment-line v1.1 interfaces self-test (gauge / raw-full / three-band, zero network)
        run: python gates/judgment_v11.py
      - name: Judge-strictness gauge self-test (preview.5 interface D, zero network)
        run: python gates/judgment_strictness.py
      - name: Six-family linkage structural validator (preview.5 interface E, zero network)
        run: python gates/family_linkage.py
      - name: Slot-space caliber gauge self-test (preview.7 interface F, zero network)
        run: python gates/slot_space_caliber.py
      - name: Slot-space caliber dual-implementation cross-check (preview.9 interface F close-out, zero network)
        run: python gates/slot_space_crosscheck.py
      - name: f3 judge calibration face self-test (preview.9, zero network)
        run: python gates/descrev_calibration.py
      - name: Readings-package completeness validator self-test (preview.9 interface G, zero network)
        run: python gates/readout_completeness.py
      - name: Memory harness MCP self-test (stdio, zero network; E-off arm — the frozen self-test asserts preview.10 phantom-key semantics)
        run: DEPOSON_EXECUTOR=0 python mcp/selftest_mcp.py
      - name: Organ v3.1 executor self-test (82 checks; AES-GCM keystore, tombstone chain, probe; zero network; E-off env only pins the frozen selftest_mcp child D10 — organ checks construct the executor directly)
        run: DEPOSON_EXECUTOR=0 python mcp/selftest_organ_v3.py
      - name: C1 no-vector-archive audit (ether_archive fake inverse-solver stays deleted; P476 'land in one pass')
        run: python scripts/c1_no_vector_archive_audit.py
      - name: Executor-face MCP stdio smoke (write -> phantom K-out -> audit; ciphertext on disk; zero network)
        run: |
          python - <<'PYEOF'
          import os, sys, json, tempfile, subprocess
          tmpd = tempfile.mkdtemp(prefix="executor_smoke_")
          env = dict(os.environ); env.pop("DEPOSON_EXECUTOR", None)
          env["CONDENSATE_LEDGER"] = os.path.join(tmpd, "ledger.jsonl")
          env["DEPOSON_THERMO"] = json.dumps({"cap": 4, "horizon": 2})  # pressurised params carried by the smoke itself (no ambient-env dependence)
          p = subprocess.Popen([sys.executable, "mcp/mcp_server.py"], stdin=subprocess.PIPE,
                               stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, env=env)
          def rpc(o):
              p.stdin.write((json.dumps(o) + "\n").encode()); p.stdin.flush()
              return json.loads(p.stdout.readline().decode())
          rpc({"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}})
          rpc({"jsonrpc":"2.0","id":2,"method":"notifications/initialized","params":{}})
          def call(name, args):
              r = rpc({"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":name,"arguments":args}})["result"]
              assert not r.get("isError"), r["content"][0]["text"]
              return r["content"][0]["text"]
          w = call("deposon_memory_write", {"key":"p.a","text":"alpha-secret"})
          assert w.startswith("written:") and "执行器已凝华" in w, w
          call("deposon_memory_write", {"key":"p.b","text":"beta-secret"})
          call("deposon_memory_read", {"prefix":"p.a"})
          for _ in range(3):
              call("deposon_thermo_settle", {}); call("deposon_memory_read", {"prefix":"p.a"})  # settle + keep p.a transmitted (p.b ages -> horizon dissipation)
          rp = call("deposon_memory_read", {"prefix":"p."})
          lines = rp.split("\n")
          assert lines[0] == "p.a: alpha-secret", rp
          ph = [l for l in lines if "⟨幻肢⟩" in l]
          assert ph and ph[0].startswith("p.: ⟨幻肢⟩"), rp          # K-out：行键＝查询前缀·存储键不出服务端
          assert "beta-secret" not in rp, rp                        # 散失内容 0 回注
          rep = json.loads(call("deposon_thermo_audit", {"format":"json"}))
          assert rep["verdict"] == "SELF-CONSISTENT" and rep["E0"] == rep["phi"] + rep["R"] + rep["D"] + rep["U"], rep.get("verdict")
          ledger = open(env["CONDENSATE_LEDGER"], encoding="utf-8").read()
          assert '"text"' not in ledger and '"ct"' in ledger, "ciphertext-only ledger face violated"
          pool = open(env["CONDENSATE_LEDGER"] + ".pool", encoding="utf-8").read()
          assert "beta" not in pool.lower(), pool                   # 散失行 DEK 已不在场
          p.kill()
          print("executor stdio smoke OK (ciphertext ledger, K-out phantom, conservation)")
          PYEOF
      - name: Ledger dual-implementation cross-check (Lean T1-T6 vs Python core, zero network; E-off arm — the frozen cross-check asserts the preview.10 ledger's corrupt-line tolerance)
        run: DEPOSON_EXECUTOR=0 python mcp/ledger_crosscheck.py
      - name: Thermodynamic ledger dual-implementation cross-check (Lean DeposonThermo vs Python core, hand-computed settlement vector)
        run: python mcp/thermo_crosscheck.py
      - name: Thermo before/after demo (frozen 500-op trace; utilisation 0 -> 69.23 %, hit rate 50.31 -> 47.85 %)
        run: python mcp/thermo_demo.py --check
      - name: DeposonThermo.lean axiom audit (static coverage; compiles when lean is on PATH)
        run: python harness/lean_axiom_audit.py
      - name: Packaging sanity (bundle patch + thermo face ship in the npm files)
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          python - <<'EOF'
          import json
          files = [f["path"] for f in json.load(open("/tmp/pack.json"))[0]["files"]]
          for need in ["cordis.patch.yml", "plugin/index.js", "mcp/mcp_server.py", "mcp/thermo_core.py",
                       "mcp/thermo_cli.py", "mcp/phantom_limb.py", "mcp/phantom_limb.zh.txt", "mcp/phantom_limb.en.txt",
                       "harness/DeposonThermo.lean", "harness/lean_axiom_audit.py", "mcp/thermo_crosscheck.py",
                       "mcp/irreversible_executor.py", "mcp/selftest_organ_v3.py",
                       "harness/IrreversibleDeposon.lean", "harness/DeposonThermoRecon.lean",
                       "scripts/c1_no_vector_archive_audit.py",
                       "mcp/thermo_demo.py", "tests/test_plugin_load.mjs"]:
              assert need in files, need
          print("packaged files OK:", len(files))
          EOF
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: dsh plugin load smoke (mock Cordis context, includes gates self-test; E-off arm — the static mirror parity and the phantom check assert the preview.10 face; executor-face smoke is the step above)
        run: DEPOSON_EXECUTOR=0 node tests/test_plugin_load.mjs
      - name: Artifacts policy check (no readings in repo)
        run: |
          ! git ls-files | grep -E '\.(jsonl|log)$|(^|/)artifacts/'
